name: Deploy App Service (API + UI)

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AZURE_SUBSCRIPTION_ID: "86b37969-9445-49cf-b03f-d8866235171c"
  AZURE_RESOURCE_GROUP: "ai-myaacoub"
  ACR_NAME: "aisearchagentacr"
  API_IMAGE: "ai-search-agent-api"

jobs:
  deploy-api:
    name: Build & Deploy API Container
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Ensure ACR exists
        run: |
          az acr show --name ${{ env.ACR_NAME }} --resource-group ${{ env.AZURE_RESOURCE_GROUP }} 2>/dev/null || \
          az acr create --name ${{ env.ACR_NAME }} --resource-group ${{ env.AZURE_RESOURCE_GROUP }} --sku Basic --admin-enabled true

      - name: Build image in ACR
        run: |
          az acr build \
            --registry ${{ env.ACR_NAME }} \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --image ${{ env.API_IMAGE }}:${{ github.sha }} \
            --image ${{ env.API_IMAGE }}:latest \
            --file Dockerfile .

      - name: Get ACR server
        id: acr
        run: |
          ACR_SERVER=$(az acr show --name ${{ env.ACR_NAME }} --query loginServer -o tsv)
          echo "server=$ACR_SERVER" >> "$GITHUB_OUTPUT"

      - name: Ensure App Service managed identity
        run: |
          az webapp identity assign \
            --name ai-search-agent-api \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }}

      - name: Grant AcrPull to App Service
        run: |
          APP_PRINCIPAL_ID=$(az webapp identity show \
            --name ai-search-agent-api \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --query principalId -o tsv)
          ACR_ID=$(az acr show \
            --name ${{ env.ACR_NAME }} \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --query id -o tsv)
          az role assignment create \
            --assignee-object-id "$APP_PRINCIPAL_ID" \
            --assignee-principal-type ServicePrincipal \
            --role AcrPull \
            --scope "$ACR_ID" || true

      - name: Configure App Service for container
        run: |
          az webapp config appsettings set \
            --name ai-search-agent-api \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --settings \
              WEBSITES_PORT=8000 \
              WEBSITES_ENABLE_APP_SERVICE_STORAGE=false

      - name: Clear stale code-deploy settings
        run: |
          az webapp config appsettings delete \
            --name ai-search-agent-api \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --setting-names WEBSITE_RUN_FROM_PACKAGE SCM_DO_BUILD_DURING_DEPLOYMENT ENABLE_ORYX_BUILD || true

      - name: Deploy container to App Service
        run: |
          az webapp config container set \
            --name ai-search-agent-api \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --container-image-name ${{ steps.acr.outputs.server }}/${{ env.API_IMAGE }}:${{ github.sha }} \
            --container-registry-url https://${{ steps.acr.outputs.server }}

      - name: Clear startup override and enable Always On
        run: |
          az webapp config set \
            --name ai-search-agent-api \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --generic-configurations '{"acrUseManagedIdentityCreds":true,"appCommandLine":"","alwaysOn":true}'

      - name: Restart App Service
        run: |
          az webapp restart \
            --name ai-search-agent-api \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }}

  deploy-ui:
    name: Deploy UI to App Service
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install UI dependencies
        working-directory: ui
        run: npm ci

      - name: Build UI (production)
        working-directory: ui
        run: npx ng build --configuration production
        env:
          CI: true

      - name: Create UI deployment package
        run: |
          cd ui
          npm ci --production --prefix /tmp/ui-pkg --package-lock-only 2>/dev/null || true
          mkdir -p /tmp/ui-pkg
          cp -r www /tmp/ui-pkg/www
          cp server.js /tmp/ui-pkg/
          cp deploy-package.json /tmp/ui-pkg/package.json
          cd /tmp/ui-pkg
          npm install --production
          zip -r $GITHUB_WORKSPACE/ui-deploy.zip .
          echo "UI zip size: $(du -h $GITHUB_WORKSPACE/ui-deploy.zip | cut -f1)"

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Disable Oryx remote build
        run: |
          az webapp config appsettings set \
            --name ai-search-agent-ui \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --settings SCM_DO_BUILD_DURING_DEPLOYMENT=false ENABLE_ORYX_BUILD=false

      - name: Configure UI startup command
        run: |
          az webapp config set \
            --name ai-search-agent-ui \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --startup-file "node server.js"

      - name: Deploy UI to App Service
        run: |
          az webapp deploy \
            --name ai-search-agent-ui \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --src-path ui-deploy.zip \
            --type zip \
            --clean true \
            --restart true
