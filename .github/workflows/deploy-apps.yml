name: Deploy App Service (API + UI)

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AZURE_SUBSCRIPTION_ID: "86b37969-9445-49cf-b03f-d8866235171c"
  AZURE_RESOURCE_GROUP: "ai-myaacoub"

jobs:
  deploy-api:
    name: Deploy API to App Service
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install runtime Python dependencies
        run: pip install -r requirements-api.txt --target .python_packages/lib/site-packages --platform manylinux2014_x86_64 --only-binary=:all: --python-version 3.12

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Configure API App Service settings
        run: |
          az webapp config appsettings set \
            --name ai-search-agent-api \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --settings \
              SCM_DO_BUILD_DURING_DEPLOYMENT=false \
              ENABLE_ORYX_BUILD=false \
              PYTHONPATH="/home/site/wwwroot:/home/site/wwwroot/.python_packages/lib/site-packages"
          az webapp config appsettings delete \
            --name ai-search-agent-api \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --setting-names WEBSITE_STARTUP_FILE WEBSITES_PORT 2>/dev/null || true

      - name: Configure API startup command
        run: |
          az webapp config set \
            --name ai-search-agent-api \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --startup-file "gunicorn app:app --workers 2 --worker-class uvicorn.workers.UvicornWorker --bind 0.0.0.0:8000 --timeout 240"

      - name: Create API deployment package
        run: |
          cp requirements-api.txt requirements.txt
          zip -r api-deploy.zip \
            app.py startup.sh requirements.txt .python-version \
            api/ config/ scripts/ data/ \
            .python_packages/ \
            -x '*/__pycache__/*' '*.pyc'
          echo "API zip size: $(du -h api-deploy.zip | cut -f1)"

      - name: Deploy API to App Service
        run: |
          az webapp deploy \
            --name ai-search-agent-api \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --src-path api-deploy.zip \
            --type zip \
            --clean true \
            --restart true \
            --timeout 600

      - name: Restart API App Service
        run: |
          az webapp restart \
            --name ai-search-agent-api \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }}

  deploy-ui:
    name: Deploy UI to App Service
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install UI dependencies
        working-directory: ui
        run: npm ci

      - name: Build UI (production)
        working-directory: ui
        run: npx ng build --configuration production
        env:
          CI: true

      - name: Create UI deployment package
        run: |
          cd ui
          npm ci --production --prefix /tmp/ui-pkg --package-lock-only 2>/dev/null || true
          mkdir -p /tmp/ui-pkg
          cp -r www /tmp/ui-pkg/www
          cp server.js /tmp/ui-pkg/
          cp deploy-package.json /tmp/ui-pkg/package.json
          cd /tmp/ui-pkg
          npm install --production
          zip -r $GITHUB_WORKSPACE/ui-deploy.zip .
          echo "UI zip size: $(du -h $GITHUB_WORKSPACE/ui-deploy.zip | cut -f1)"

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Disable Oryx remote build
        run: |
          az webapp config appsettings set \
            --name ai-search-agent-ui \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --settings SCM_DO_BUILD_DURING_DEPLOYMENT=false ENABLE_ORYX_BUILD=false

      - name: Configure UI startup command
        run: |
          az webapp config set \
            --name ai-search-agent-ui \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --startup-file "node server.js"

      - name: Deploy UI to App Service
        run: |
          az webapp deploy \
            --name ai-search-agent-ui \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --src-path ui-deploy.zip \
            --type zip \
            --clean true \
            --restart true
