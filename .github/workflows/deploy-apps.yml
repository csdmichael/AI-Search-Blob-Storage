name: Deploy App Service (API + UI)

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AZURE_SUBSCRIPTION_ID: "86b37969-9445-49cf-b03f-d8866235171c"
  AZURE_RESOURCE_GROUP: "ai-myaacoub"
  ACR_NAME: "aisearchagentacr"
  API_IMAGE: "ai-search-agent-api"

jobs:
  deploy-api:
    name: Build & Deploy API Container
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Ensure ACR exists
        run: |
          az acr show --name ${{ env.ACR_NAME }} --resource-group ${{ env.AZURE_RESOURCE_GROUP }} 2>/dev/null || \
          az acr create --name ${{ env.ACR_NAME }} --resource-group ${{ env.AZURE_RESOURCE_GROUP }} --sku Basic --admin-enabled true

      - name: Build image in ACR
        run: |
          az acr build \
            --registry ${{ env.ACR_NAME }} \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --image ${{ env.API_IMAGE }}:${{ github.sha }} \
            --image ${{ env.API_IMAGE }}:latest \
            --file Dockerfile .

      - name: Get ACR credentials
        id: acr-creds
        run: |
          ACR_SERVER=$(az acr show --name ${{ env.ACR_NAME }} --query loginServer -o tsv)
          ACR_USER=$(az acr credential show --name ${{ env.ACR_NAME }} --query username -o tsv)
          ACR_PASS=$(az acr credential show --name ${{ env.ACR_NAME }} --query "passwords[0].value" -o tsv)
          echo "server=$ACR_SERVER" >> "$GITHUB_OUTPUT"
          echo "username=$ACR_USER" >> "$GITHUB_OUTPUT"
          echo "::add-mask::$ACR_PASS"
          echo "password=$ACR_PASS" >> "$GITHUB_OUTPUT"

      - name: Configure App Service for container
        run: |
          az webapp config appsettings set \
            --name ai-search-agent-api \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --settings \
              WEBSITES_PORT=8000 \
              DOCKER_REGISTRY_SERVER_URL=https://${{ steps.acr-creds.outputs.server }} \
              DOCKER_REGISTRY_SERVER_USERNAME=${{ steps.acr-creds.outputs.username }} \
              DOCKER_REGISTRY_SERVER_PASSWORD=${{ steps.acr-creds.outputs.password }}

      - name: Deploy container to App Service
        run: |
          az webapp config container set \
            --name ai-search-agent-api \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --container-image-name ${{ steps.acr-creds.outputs.server }}/${{ env.API_IMAGE }}:${{ github.sha }} \
            --container-registry-url https://${{ steps.acr-creds.outputs.server }} \
            --container-registry-user ${{ steps.acr-creds.outputs.username }} \
            --container-registry-password ${{ steps.acr-creds.outputs.password }}

      - name: Restart App Service
        run: |
          az webapp restart \
            --name ai-search-agent-api \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }}

  deploy-ui:
    name: Deploy UI to App Service
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install UI dependencies
        working-directory: ui
        run: npm ci

      - name: Build UI (production)
        working-directory: ui
        run: npx ng build --configuration production
        env:
          CI: true

      - name: Create UI deployment package
        run: |
          cd ui
          npm ci --production --prefix /tmp/ui-pkg --package-lock-only 2>/dev/null || true
          mkdir -p /tmp/ui-pkg
          cp -r www /tmp/ui-pkg/www
          cp server.js /tmp/ui-pkg/
          cp deploy-package.json /tmp/ui-pkg/package.json
          cd /tmp/ui-pkg
          npm install --production
          zip -r $GITHUB_WORKSPACE/ui-deploy.zip .
          echo "UI zip size: $(du -h $GITHUB_WORKSPACE/ui-deploy.zip | cut -f1)"

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Disable Oryx remote build
        run: |
          az webapp config appsettings set \
            --name ai-search-agent-ui \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --settings SCM_DO_BUILD_DURING_DEPLOYMENT=false ENABLE_ORYX_BUILD=false

      - name: Configure UI startup command
        run: |
          az webapp config set \
            --name ai-search-agent-ui \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --startup-file "node server.js"

      - name: Deploy UI to App Service
        run: |
          az webapp deploy \
            --name ai-search-agent-ui \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --src-path ui-deploy.zip \
            --type zip \
            --clean true \
            --restart true
