name: Deploy AI Search + Foundry Agent Solution

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      use_case:
        description: "Use case to deploy (engineering_docs or filter_design or all)"
        required: false
        default: "all"

permissions:
  id-token: write
  contents: read

env:
  # Azure resource values are also stored in config/azure_resources.json
  # These env vars are only needed for Azure Login action
  AZURE_SUBSCRIPTION_ID: "86b37969-9445-49cf-b03f-d8866235171c"
  AZURE_RESOURCE_GROUP: "ai-myaacoub"
  PYTHON_VERSION: "3.11"

jobs:
  deploy-engineering-docs:
    name: Deploy Engineering Docs Use Case
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.use_case == 'all' || github.event.inputs.use_case == 'engineering_docs' || github.event_name == 'push' }}
    env:
      USE_CASE: engineering_docs

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Azure Login (Federated Identity)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Generate Engineering Documents
        run: python scripts/generate_docs.py

      - name: Upload Documents and JSON Sidecars to Blob Storage
        run: python scripts/upload_to_blob.py

      - name: Create AI Search Index and Indexer
        run: python scripts/create_search_index.py

      - name: Chunk Documents and Create Enhanced Index
        run: python scripts/chunk_and_index.py

      - name: Wait for Indexer to Complete
        run: |
          echo "Waiting 60 seconds for indexer to process documents..."
          sleep 60

      - name: Create Foundry Agent
        run: python scripts/create_agent.py
        env:
          AZURE_AI_SEARCH_CONNECTION_NAME: ${{ secrets.AZURE_AI_SEARCH_CONNECTION_NAME }}

      - name: Fine-Tune and Evaluate Model
        run: python scripts/fine_tune_and_evaluate.py

      - name: Run Ranking & Feedback Evaluation
        run: python scripts/ranking_feedback.py

  deploy-filter-design:
    name: Deploy Filter Design Use Case
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.use_case == 'all' || github.event.inputs.use_case == 'filter_design' || github.event_name == 'push' }}
    env:
      USE_CASE: filter_design

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Azure Login (Federated Identity)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Generate Filter Design Documents (PDF)
        run: python scripts/generate_filter_docs.py

      - name: Upload Documents and JSON Sidecars to Blob Storage
        run: python scripts/upload_to_blob.py

      - name: Create AI Search Index and Indexer
        run: python scripts/create_search_index.py

      - name: Chunk Documents and Create Enhanced Index
        run: python scripts/chunk_and_index.py

      - name: Wait for Indexer to Complete
        run: |
          echo "Waiting 60 seconds for indexer to process documents..."
          sleep 60

      - name: Create Filter Design Agent
        run: python scripts/create_agent.py
        env:
          AZURE_AI_SEARCH_CONNECTION_NAME: ${{ secrets.AZURE_AI_SEARCH_CONNECTION_NAME }}

      - name: Fine-Tune and Evaluate Model
        run: python scripts/fine_tune_and_evaluate.py

      - name: Run Ranking & Feedback Evaluation
        run: python scripts/ranking_feedback.py

  generate-assets:
    name: Generate Shared Assets (Diagrams)
    needs: [deploy-engineering-docs, deploy-filter-design]
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate Architecture Diagrams (combined + per-use-case)
        run: python scripts/generate_architecture_diagram.py

      - name: Upload diagrams as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: architecture-diagrams
          path: |
            docs/architecture.png
            use-cases/engineering-docs/architecture.png
            use-cases/filter-design/architecture.png

  test:
    name: Test Solution
    needs: [deploy-engineering-docs, deploy-filter-design]
    if: always()
    runs-on: ubuntu-latest

    strategy:
      matrix:
        use_case: [engineering_docs, filter_design]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Azure Login (Federated Identity)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Run Search Tests (${{ matrix.use_case }})
        run: python scripts/test_search.py
        env:
          USE_CASE: ${{ matrix.use_case }}
          AZURE_AI_SEARCH_CONNECTION_NAME: ${{ secrets.AZURE_AI_SEARCH_CONNECTION_NAME }}

  deploy-api:
    name: Deploy API to App Service
    needs: [test]
    if: always() && !cancelled()
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create API deployment package
        run: |
          tar -cf api-deploy.zip --format=zip \
            --exclude=ui --exclude=.venv --exclude=node_modules \
            --exclude="api-logs*" --exclude="ui-logs*" \
            --exclude=__pycache__ --exclude=.git --exclude="*.zip" .
          echo "API zip size: $(du -h api-deploy.zip | cut -f1)"

      - name: Deploy API to App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ai-search-agent-api
          publish-profile: ${{ secrets.AZURE_API_PUBLISH_PROFILE }}
          package: api-deploy.zip

  deploy-ui:
    name: Deploy UI to App Service
    needs: [test]
    if: always() && !cancelled()
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install UI dependencies
        working-directory: ui
        run: npm ci

      - name: Build UI (production)
        working-directory: ui
        run: npx ng build --configuration production
        env:
          CI: true

      - name: Create UI deployment package
        run: |
          mkdir -p /tmp/ui-pkg
          cp -r ui/www /tmp/ui-pkg/www
          cp ui/server.js /tmp/ui-pkg/
          cp ui/deploy-package.json /tmp/ui-pkg/package.json
          cd /tmp/ui-pkg
          tar -cf $GITHUB_WORKSPACE/ui-deploy.zip --format=zip .
          echo "UI zip size: $(du -h $GITHUB_WORKSPACE/ui-deploy.zip | cut -f1)"

      - name: Deploy UI to App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ai-search-agent-ui
          publish-profile: ${{ secrets.AZURE_UI_PUBLISH_PROFILE }}
          package: ui-deploy.zip
